<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Dietician</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="auth-loading" class="auth-loading">Checking sign-in…</div>

  <main class="app">
    <button id="logout-btn" class="logout-btn" aria-label="Log out">Log out</button>
    <header class="header">
      <div class="brand">
        <span class="brand-mark">🥗</span>
        <h1 id="ai-name">Mira</h1>
      </div>
      <p class="role-line">Your AI Dietician</p>
      <h2 id="welcome" class="welcome hidden"></h2>
      <p class="subtitle">Your personal nutrition companion — just talk to me.</p>
    </header>

    <!-- Live state indicator -->
    <section class="stage">
      <div id="orb" class="orb state-idle" aria-hidden="true">
        <div class="orb-core"></div>
        <div class="orb-ring ring1"></div>
        <div class="orb-ring ring2"></div>
        <div class="orb-ring ring3"></div>
      </div>
      <p id="status" class="status">Tap the mic to start talking</p>
    </section>

    <!-- Mic button = primary interaction (voice input; not supported on iOS) -->
    <button id="mic-btn" class="mic-btn" aria-label="Start talking">
      <svg viewBox="0 0 24 24" width="42" height="42" fill="currentColor" aria-hidden="true">
        <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3z"/>
        <path d="M19 12a7 7 0 0 1-14 0H3a9 9 0 0 0 8 8.94V23h2v-2.06A9 9 0 0 0 21 12h-2z"/>
      </svg>
    </button>

    <!-- Text input: fallback for iPhone/Safari (no mic STT), also usable anywhere.
         On iOS, tapping the keyboard's mic dictates into this field. -->
    <form id="text-form" class="text-form" autocomplete="off">
      <input id="text-input" class="text-input" type="text"
             placeholder="or type your message…" enterkeyhint="send" />
      <button type="submit" class="text-send" aria-label="Send message">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
          <path d="M2 21l21-9L2 3v7l15 2-15 2z"/>
        </svg>
      </button>
    </form>

    <!-- Conversation log: last 10 messages load here on login, new ones append -->
    <section class="transcript" id="messages"></section>

    <footer class="footer">
      <button id="stop-speak" class="ghost-btn hidden">Stop speaking</button>
      <p id="compat-note" class="compat-note hidden"></p>
    </footer>
  </main>

  <!-- Auth guard: redirects to /login if not signed in, wires logout. -->
  <script type="module" src="js/guard.js"></script>
  <script src="app.js"></script>
</body>
</html>

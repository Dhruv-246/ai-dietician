<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mira — Kamya Wellness</title>
  <style>
    /* Step-2 (onboarding) = green. Step-3 (ongoing "ask anything") = blue. Light only. */
    :root{
      --bg: linear-gradient(180deg,#dff3e6 0%,#eaf7ef 55%,#ffffff 100%);
      --accent:#23a95a; --accent-2:#43d67e;
      --ring: radial-gradient(circle,#ffffff 60%,rgba(35,169,90,.16) 100%);
      --pulse: rgba(35,169,90,.4); --pulse0: rgba(35,169,90,0);
      --eyebrow-bg: rgba(35,169,90,.12); --eyebrow-fg:#1c6b3f;
      --bubble-user:#cdeed9; --bubble-mira-border:#e2efe7;
      --ink:#12261c; --muted:#6b8577;
    }
    body.ongoing{
      --bg: linear-gradient(180deg,#e4edfb 0%,#eef4fc 55%,#ffffff 100%);
      --accent:#2f6fed; --accent-2:#5b8ff5;
      --ring: radial-gradient(circle,#ffffff 60%,rgba(47,111,237,.16) 100%);
      --pulse: rgba(47,111,237,.4); --pulse0: rgba(47,111,237,0);
      --eyebrow-bg: rgba(47,111,237,.12); --eyebrow-fg:#1e4fb0;
      --bubble-user:#dbe7fb; --bubble-mira-border:#e2e9f6;
      --ink:#101a2e; --muted:#5a6b86;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; min-height: 100dvh;
      background: var(--bg); color: var(--ink);
      display: flex; flex-direction: column; align-items: center;
      justify-content: space-between; padding: 40px 24px 48px; text-align: center;
    }
    .top { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .brand { font-size: 15px; font-weight: 700; color: var(--muted); letter-spacing: .02em; }
    .eyebrow { font-size: 11.5px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase;
      color: var(--eyebrow-fg); background: var(--eyebrow-bg); padding: 5px 13px; border-radius: 999px; }
    .memlink { font-size: 12.5px; font-weight: 700; color: var(--eyebrow-fg); text-decoration: none;
      background: var(--eyebrow-bg); padding: 6px 13px; border-radius: 999px; }
    .memlink:active { transform: scale(0.96); }
    .center { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .avatar-ring {
      width: 200px; height: 200px; border-radius: 50%;
      display: grid; place-items: center; background: var(--ring);
      box-shadow: 0 0 0 10px rgba(255,255,255,0.7), 0 20px 50px rgba(0,0,0,0.08);
    }
    .avatar {
      width: 168px; height: 168px; border-radius: 50%;
      background: #dfeee6 url("mira_avatar.jpg") center/cover no-repeat;
      border: 4px solid #fff;
    }
    body.connecting .avatar-ring { animation: pulse 1.4s ease-out infinite; }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 10px rgba(255,255,255,0.7), 0 0 0 0 var(--pulse); }
      100% { box-shadow: 0 0 0 10px rgba(255,255,255,0.7), 0 0 0 40px var(--pulse0); }
    }
    .name { font-size: 32px; font-weight: 800; letter-spacing: -0.02em; }
    .subtitle { font-size: 16px; color: var(--muted); margin-top: -4px; }
    .status { font-size: 15px; color: var(--muted); font-weight: 600; min-height: 20px; }
    .status .dot { color: var(--accent); }
    .timer { font-size: 18px; color: var(--accent); font-weight: 700; min-height: 20px; }
    .controls { display: flex; gap: 28px; align-items: center; }
    .btn {
      width: 82px; height: 82px; border-radius: 50%; border: none; cursor: pointer;
      display: grid; place-items: center; color: #fff;
      box-shadow: 0 12px 30px rgba(0,0,0,0.18); transition: transform .12s ease, opacity .2s ease;
    }
    .btn:active { transform: scale(0.94); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn.green { background: linear-gradient(145deg, var(--accent-2), var(--accent)); }
    .btn.red { background: linear-gradient(145deg, #ff5b5b, #e53935); }
    .btn svg { width: 34px; height: 34px; fill: #fff; }
    .hidden { display: none !important; }
    .hint { font-size: 13.5px; color: var(--muted); margin-top: 10px; max-width: 340px; }
    .outbtn { margin-top: 14px; padding: 8px 16px; border-radius: 999px; border: 1px solid var(--eyebrow-bg);
      background: #ffffff; color: var(--eyebrow-fg); font-size: 14px; font-weight: 600; cursor: pointer; }
    .outbtn:active { transform: scale(0.96); }
    .logoutlink { margin-top: 18px; font-size: 13px; font-weight: 600; color: var(--muted);
      text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
    .transcript {
      width: min(620px, 92%); max-height: 30vh; overflow-y: auto;
      display: flex; flex-direction: column; gap: 8px; margin: 4px 0;
    }
    .msg { max-width: 82%; padding: 9px 13px; border-radius: 16px; font-size: 15px; line-height: 1.35; text-align: left; }
    .msg .who { display: block; font-size: 11px; font-weight: 700; color: var(--muted); margin-bottom: 2px; }
    .msg.user { align-self: flex-end; background: var(--bubble-user); border-bottom-right-radius: 5px; }
    .msg.mira { align-self: flex-start; background: #fff; border: 1px solid var(--bubble-mira-border); border-bottom-left-radius: 5px; }
  </style>
  <!-- LiveKit browser SDK (managed WebRTC — connects reliably from any host) -->
  <script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>
</head>
<body>
  <div class="top">
    <div class="brand">Kamya Wellness</div>
    <div class="eyebrow" id="eyebrow"></div>
    <a class="memlink hidden" id="memLink" target="_blank" rel="noopener">🧠 What Mira remembers</a>
  </div>

  <div class="center">
    <div class="avatar-ring">
      <div class="avatar" id="avatar"></div>
    </div>
    <div class="name">Mira</div>
    <div class="subtitle" id="subtitle"></div>
    <div class="status" id="status"></div>
    <div class="timer" id="timer"></div>
  </div>

  <div class="transcript hidden" id="transcript"></div>

  <div class="controls">
    <!-- Green: start the call -->
    <button id="callBtn" class="btn green" aria-label="Start call">
      <svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.2.4 2.5.6 3.8.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.6.6 3.8.1.4 0 .8-.3 1l-2.2 2.2z"/></svg>
    </button>
    <!-- Red: hang up -->
    <button id="hangBtn" class="btn red hidden" aria-label="End call">
      <svg viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.1-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.51-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg>
    </button>
  </div>
  <div class="hint" id="hint">Tap the green button to talk to Mira</div>
  <button id="outBtn" class="outbtn hidden" type="button">🔈 Earpiece</button>
  <a id="logoutLink" class="logoutlink hidden">Log out</a>

  <audio id="botAudio" autoplay></audio>

  <script>
    const $ = (id) => document.getElementById(id);
    const LK = window.LivekitClient;
    let room = null, seconds = 0, timerInt = null, didConnect = false;
    const params = new URLSearchParams(location.search);
    const uid = params.get("uid") || "";
    const mode = params.get("mode") || "";   // "ongoing" = Step-3 ask-Mira call; else onboarding call

    // Distinct identity for the two products (light theme only):
    //   Step 2 = onboarding call (green) · Step 3 = ongoing "ask anything" (blue).
    const MODES = {
      onboarding: {
        cls: "onboarding", eyebrow: "Step 1 · Onboarding call",
        subtitle: "Let's set up your plan",
        hint: "Proceed to have your onboarding call with Mira",
      },
      ongoing: {
        cls: "ongoing", eyebrow: "Your AI dietician",
        subtitle: "Ask me anything",
        hint: "Tap to talk — ask Mira any question about your food, diet or health",
      },
    };
    const cfg = MODES[mode === "ongoing" ? "ongoing" : "onboarding"];
    document.body.classList.add(cfg.cls);
    $("eyebrow").textContent = cfg.eyebrow;
    $("subtitle").textContent = cfg.subtitle;
    $("hint").textContent = cfg.hint;

    // Step-3 only: touch points to view what Mira remembers + to log out.
    // (Logout runs on the web app origin, where the Firebase session lives.)
    const WEB_APP_URL = "https://web-production-45f0d.up.railway.app";
    if (cfg.cls === "ongoing") {
      if (uid) {
        const m = $("memLink");
        m.href = "/memory?uid=" + encodeURIComponent(uid);
        m.classList.remove("hidden");
      }
      const lo = $("logoutLink");
      lo.href = WEB_APP_URL + "/logout";
      lo.classList.remove("hidden");
    }

    function setStatus(t) { $("status").innerHTML = t; }
    function startTimer() {
      seconds = 0;
      timerInt = setInterval(() => {
        seconds++;
        const m = String(Math.floor(seconds / 60)).padStart(2, "0");
        const s = String(seconds % 60).padStart(2, "0");
        $("timer").textContent = `${m} : ${s}`;
      }, 1000);
    }
    function stopTimer() { clearInterval(timerInt); }

    // --- Ringback tone: the "calling…" sound while Mira picks up ----------
    let audioCtx = null, ringTimer = null;
    function startRing() {
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
      } catch (_) { return; }
      const beep = (at, freq) => {
        const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
        osc.type = "sine"; osc.frequency.value = freq;
        osc.connect(g); g.connect(audioCtx.destination);
        g.gain.setValueAtTime(0.0001, at);
        g.gain.exponentialRampToValueAtTime(0.14, at + 0.02);
        g.gain.setValueAtTime(0.14, at + 0.33);
        g.gain.exponentialRampToValueAtTime(0.0001, at + 0.4);
        osc.start(at); osc.stop(at + 0.42);
      };
      const ringOnce = () => {
        if (!audioCtx) return;
        const t = audioCtx.currentTime;
        beep(t, 440); beep(t + 0.6, 480);   // classic two-tone ring
      };
      ringOnce();
      ringTimer = setInterval(ringOnce, 2600);
    }
    function stopRing() { if (ringTimer) { clearInterval(ringTimer); ringTimer = null; } }

    // --- Audio output: earpiece (default) vs speaker ----------------------
    // Best-effort: browsers only let a web page pick the output device where
    // setSinkId is supported (desktop + newer Android Chrome). On iOS it's not
    // available, so the toggle is hidden there and the OS controls routing.
    let speakerOn = false;   // false = earpiece (default), true = speaker
    const canRoute = "setSinkId" in HTMLMediaElement.prototype;
    async function applyOutput() {
      if (!canRoute) return;
      try {
        const outs = (await navigator.mediaDevices.enumerateDevices())
          .filter((d) => d.kind === "audiooutput");
        const find = (re) => outs.find((d) => re.test(d.label || ""));
        let dev = speakerOn ? find(/speaker|speakerphone/i) : find(/earpiece|receiver|handset/i);
        if (!dev) dev = outs.find((d) => d.deviceId === (speakerOn ? "default" : "communications")) || outs[0];
        if (dev) await $("botAudio").setSinkId(dev.deviceId);
      } catch (_) {}
      $("outBtn").textContent = speakerOn ? "🔊 Speaker" : "🔈 Earpiece";
    }
    function toggleOutput() { speakerOn = !speakerOn; applyOutput(); }

    function addCaption(role, text) {
      const box = $("transcript");
      box.classList.remove("hidden");
      const line = document.createElement("div");
      line.className = "msg " + (role === "user" ? "user" : "mira");
      const who = document.createElement("span");
      who.className = "who";
      who.textContent = role === "user" ? "You" : "Mira";
      line.appendChild(who);
      line.appendChild(document.createTextNode(text));
      box.appendChild(line);
      box.scrollTop = box.scrollHeight;
    }

    function showConnected() {
      didConnect = true;
      stopRing();
      setStatus('<span class="dot">●</span> Connected');
      document.body.classList.remove("connecting");
      $("callBtn").classList.add("hidden");
      $("hangBtn").classList.remove("hidden");
      startTimer();
      if (canRoute) { $("outBtn").classList.remove("hidden"); applyOutput(); }
    }

    async function startCall() {
      try {
        $("callBtn").disabled = true;
        setStatus('<span class="dot">●</span> Calling Mira…');
        document.body.classList.add("connecting");
        $("hint").textContent = "";
        $("transcript").innerHTML = "";
        $("transcript").classList.add("hidden");
        startRing();   // ringback until Mira answers

        // 1. Ask our server for a room + join token (this also launches Mira).
        //    uid + mode (read at page load) tell the server which user this is
        //    and which call (onboarding vs ongoing Step-3).
        const res = await fetch("/connect", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ uid, mode }),
        });
        if (!res.ok) throw new Error("connect failed: " + res.status);
        const { url, token } = await res.json();

        // 2. Join the LiveKit room.
        room = new LK.Room({ adaptiveStream: true, dynacast: true });

        // Play Mira's audio when her track arrives.
        room.on(LK.RoomEvent.TrackSubscribed, (track) => {
          if (track.kind === "audio") track.attach($("botAudio"));
        });
        // Live captions: the bot sends {role, text} JSON as data messages.
        room.on(LK.RoomEvent.DataReceived, (payload) => {
          try {
            const msg = JSON.parse(new TextDecoder().decode(payload));
            if (msg && msg.text) addCaption(msg.role, msg.text);
          } catch (_) {}
        });
        room.on(LK.RoomEvent.Disconnected, () => endCall());

        await room.connect(url, token);

        // 3. Publish the mic (prompts for permission). If the mic is blocked or
        //    missing, stay connected anyway so the user can still HEAR Mira
        //    (they just won't be able to talk back until they enable it).
        try {
          // Echo cancellation + noise suppression so Mira's own voice and
          // background noise don't feed back into the mic and cause false
          // interruptions.
          await room.localParticipant.setMicrophoneEnabled(true, {
            echoCancellation: true, noiseSuppression: true, autoGainControl: true,
          });
        } catch (micErr) {
          $("hint").textContent = "Mic is off — enable it to talk back to Mira";
        }

        showConnected();
      } catch (err) {
        stopRing();
        setStatus("Could not connect");
        $("hint").textContent = String(err.message || err);
        document.body.classList.remove("connecting");
        $("callBtn").disabled = false;
        try { if (room) await room.disconnect(); } catch (_) {}
        room = null;
      }
    }

    async function endCall() {
      stopTimer();
      stopRing();
      $("outBtn").classList.add("hidden");
      try { if (room) await room.disconnect(); } catch (_) {}
      room = null;
      document.body.classList.remove("connecting");
      $("hangBtn").classList.add("hidden");
      $("callBtn").classList.remove("hidden");
      $("callBtn").disabled = false;
      $("timer").textContent = "";
      setStatus("Call ended");
      // After the ONBOARDING call (Step 2) finishes, move the user into the
      // ongoing Step-3 "talk to Mira" call. On the Step-3 call itself, just let
      // them tap the green button to talk again. There is no chat screen.
      if (didConnect && mode !== "ongoing" && uid) {
        window.location.replace("/?uid=" + encodeURIComponent(uid) + "&mode=ongoing");
        return;
      }
      $("hint").textContent = cfg.hint;
    }

    $("callBtn").addEventListener("click", startCall);
    $("hangBtn").addEventListener("click", endCall);
    $("outBtn").addEventListener("click", toggleOutput);
  </script>
</body>
</html>
